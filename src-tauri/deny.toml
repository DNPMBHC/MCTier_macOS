# cargo-deny 配置（见 issue #17 第 12 条）
# 用法：cd src-tauri && cargo deny check
#
# 判定原则：**能修的必须修，修不掉的显式记录并写明为什么修不掉**。
# 凡是写进 ignore 的条目都要注明上游链路与不可修原因，避免这个文件退化成
# "把所有告警都关掉"的清单。每一条的判据都必须落在下面三类之一：
#   1. 仅构建期使用，且输入是本仓库钉死版本号 + 校验 SHA-256 的官方归档；
#   2. 上游锁定版本，本项目无法单独升级（等上游）；
#   3. 公告本身只是"不再维护"，没有已知漏洞。

[advisories]
ignore = [
    # ---- 仅构建期、输入不可被第三方控制 ----
    # zip 2.4.2 是 sherpa-onnx-sys 的构建期依赖（固定 =1.13.8），只用于解压
    # 本仓库钉死版本号、并校验 SHA-256 的 sherpa-onnx 官方 prebuilt 归档
    # （见 scripts/prepare-sherpa-windows.ps1）。我们自己的解压调用已升级到
    # zip 9 且从不使用受影响的两个 API（ZipArchive::extract / ZipStreamReader）。
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # webpki-roots 0.26.11：链路 ureq 2.12.1 → sherpa-onnx-sys（构建期），
    # 用同一份校验过的官方归档，不访问任意第三方站点。ureq 2.x 锁定 ^0.26，
    # 而公告的修复只在 1.0.10+ 的 1.x 线上，0.26 线整体无法修复；
    # 升级需要 sherpa-onnx 自己换到 ureq 3.x。
    "RUSTSEC-2026-0381",

    # ---- 上游锁定版本，等上游 ----
    # fxhash：链路 tauri-utils → kuchikiki → selectors，Tauri 构建期处理 CSS
    # 选择器用。公告为"不再维护"，无已知漏洞，版本由 tauri 2.x 决定。
    "RUSTSEC-2025-0057",

    # proc-macro-error：链路 tauri → tray-icon → libappindicator → gtk → glib-macros
    # （仅 Linux 目标）。同为"不再维护"，无已知漏洞；glib-macros 的版本由
    # gtk-rs 0.18 系列决定，本项目无法单独升级。
    "RUSTSEC-2024-0370",

    # unic-* 五连（char-property / char-range / common / ucd-ident / ucd-version）：
    # 链路 tauri-utils → urlpattern → unic-ucd-ident，属于 Tauri 处理 URL 模式
    # 的依赖。公告均为"不再维护"，无已知漏洞。版本由 tauri 2.x 决定。
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",

    # zvariant / zvariant_derive / zbus_names：链路 rfd → ashpd → zbus 5 → zvariant。
    # 上游已把这些 crate 合并进 zbus 6，公告本身说明"无安全升级路径"；
    # 换 zbus 6 需要 rfd 与 tauri-plugin-single-instance 同时升级。
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# 允许的依赖许可证。MCTier 自有代码为源码可得非商业许可，
# 但依赖必须是这些常见的宽松/弱著佐权协议之一。
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "LGPL-3.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots（经 ureq → sherpa-onnx-sys 进入）只包含 Mozilla 根证书数据，
    # 以 CDLA-Permissive-2.0 发布，允许自由使用与再分发。
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys（zip 9 的 bzip2 后端）使用 bzip2 自己的宽松许可。
    # 保留它是为了让用户上传的 bzip2 压缩 ZIP 仍能解压。
    "bzip2-1.0.6",
    # MCTier 自有 workspace crate 不写 license 字段：仓库根 LICENSE 是自定义的
    # 「源码可得非商业」协议，没有对应 SPDX 标识符，Cargo 的 license 字段只能写
    # SPDX 表达式。编造一个近似标识符会让工具输出与实际法律条款不符。
    # 这些包通过 [licenses.private] 声明为私有包处理，第三方依赖仍逐包检查。
]
confidence-threshold = 0.8

[licenses.private]
# 本项目不发布到 crates.io（各 crate 均 publish = false），workspace 内的包
# 全部视为私有，不再要求 SPDX license 字段。
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
