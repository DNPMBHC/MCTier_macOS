name: Build

# 全平台自动打包：这是 MCTier 唯一的正式出包途径，日常不再需要本地打包。
#
# 触发方式：
#   - push 到 master/main：出全部平台的产物（workflow artifact），用于日常验证。
#   - push 形如 v* 的 tag：出全部平台，并自动创建/更新对应 GitHub Release 并附加产物。
#   - workflow_dispatch：手动随时出包；填了 release_tag 就同时附到该 Release。
#
# 刻意不在 PR 上运行：整套矩阵（5 个 job）耗时约 20 分钟，PR 的常规检查由 ci.yml 承担。
#
# 产物未签名。Windows 安装包会触发 SmartScreen 提示；Android 为 debug APK，
# 因签名与已发布版本不同，无法覆盖升级，只能卸载重装。正式分发需要签名时，
# 请参见 docs/release-signing.md 的本地/发布机流程。
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把全部产物附加到该 tag 的 Release（留空则只上传为构建产物）'
        required: false
        type: string

permissions:
  contents: read

# 打包耗时且产物重要：只允许 push 触发的运行被新推送取消。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # husky 的 install hook 在 CI 里没有意义
  HUSKY: '0'

jobs:
  windows:
    name: Windows x64 (NSIS installer)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # 镜像自带 LLVM（libclang.dll），bindgen 依赖需要。
      LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      # workspace 化后 lockfile 与产物目录都在仓库根，这里不能写 src-tauri，
      # 否则缓存键算错、每次都全量重编译。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: protoc

      - name: Fetch third-party driver binaries (wintun / WinDivert)
        run: .\scripts\fetch-binaries.ps1

      - name: Build Npcap-free EasyTier binaries
        run: .\scripts\build-easytier-npcap-free.ps1

      - name: Stage pinned sherpa-onnx archive
        # target_directory 由 cargo 自己解析：workspace 化后是仓库根 target/，
        # 不能写死 src-tauri/target。
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          .\scripts\prepare-sherpa-windows.ps1 -CargoTargetDirectory $metadata.target_directory

      - name: Install frontend dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run tauri -- build --bundles nsis --ci

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/mctier.exe

  linux:
    name: Linux x64 (deb + AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # CI 无 FUSE 时让 linuxdeploy/appimagetool 以解压模式运行
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file unzip pkg-config \
            libssl-dev libgtk-3-dev librsvg2-dev patchelf nasm \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libfuse2t64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch EasyTier Linux binaries
        # 下载官方 v2.5.0 包并逐个校验 SHA-256，不匹配即中止。
        run: bash MCTier-Linux/scripts/fetch-binaries.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and bundle (deb + AppImage)
        # 直接调 tauri，不走 MCTier-Linux/scripts/build.sh：那个脚本会把
        # npm test / cargo test 变成打包的阻断步骤，测试应该由 ci.yml 负责。
        run: npm run tauri -- build --bundles deb,appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  macos:
    name: macOS ${{ matrix.arch }} (DMG)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 必须在对应架构的 runner 上构建：EasyTier 需要同架构的 Mach-O 二进制，
          # Tauri 也按本机架构出包。
          - runner: macos-26 # Apple Silicon（主目标）
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-26-intel # Intel（尽力而为，见下方 continue-on-error）
            arch: x86_64
            target: x86_64-apple-darwin
    # Intel runner 档期不稳定；缺档或失败不应让 Apple Silicon 的产物失败。
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    # 不需要在 workflow 里设 MCTIER_MACOS_EASYTIER_*：这些只是 MCTier-macOS/scripts/build.sh
    # 自己的内部开关，而本 workflow 直接调 tauri（不走 build.sh）。MCTIER_NO_PAUSE 同理，
    # 它是 build-dmg.command 的交互暂停开关，CI 不调用那个入口。
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        # cmake：turbojpeg-sys 在 macOS 上从源码构建需要。
        run: |
          set -eu
          command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Build pinned EasyTier macOS binaries
        # EasyTier 不从上游下载预编译产物，一律从固定 commit 源码构建，
        # 脚本内校验 commit、Mach-O 类型与 --version 后再原子安装。
        run: ./MCTier-macOS/scripts/build-easytier.sh

      - name: Verify EasyTier binaries are Mach-O
        run: ./MCTier-macOS/scripts/fetch-binaries.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Build release DMG
        # 不调用 build.sh：它会把测试变成打包的阻断步骤，测试由 ci.yml 负责。
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles dmg --config src-tauri/tauri.macos.conf.json

      - name: Verify the DMG is non-empty
        run: |
          set -eu
          shopt -s nullglob
          # workspace 化后产物在仓库根 target/，不再是 src-tauri/target。
          files=(target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          ((${#files[@]} > 0)) || { echo '未生成 DMG'; exit 1; }
          for f in "${files[@]}"; do
            test -s "$f" || { echo "DMG 为空: $f"; exit 1; }
            echo "DMG: $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MCTier-macOS-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  android:
    name: Android arm64-v8a (APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      # Gradle 通过 build-image-optimizer.mjs 在 shared/image-optimizer 下
      # 用 cargo ndk 独立构建；它刻意排除在根 workspace 之外，有自己的 target。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: shared/image-optimizer

      - name: Install cargo-ndk
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 任务会调用仓库根目录的 node 脚本（esbuild / libarchive.js / 语音模型）
      - name: Install frontend build dependencies
        run: npm ci

      - name: Build debug APK
        # 仓库刻意用 preSignedReleaseBuild 挡住无签名的 release 构建（assembleRelease
        # 的任务图同样包含该检查），正式 APK 必须走本地签名打包脚本；CI 只产出 debug APK。
        working-directory: MCTier-Android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-android
          cp MCTier-Android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-android/MCTier-${version}-android-arm64-v8a-debug.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-arm64-v8a
          if-no-files-found: error
          retention-days: 14
          path: dist-android/*.apk

  release:
    name: Attach artifacts to Release
    needs: [windows, linux, macos, android]
    # tag 推送时创建/更新 Release；手动触发时填了 release_tag 才执行。
    #
    # 用 always() 而不是默认的 needs 成功语义，是因为 macOS Intel 腿挂了
    # continue-on-error：它在 run 结论里仍可能显示为失败，但不应挡住 Release。
    # 于是"是否发布"改由下方按平台家族逐个校验产物来决定 —— 四个平台里缺任何一个
    # 都不发布，避免出现缺了某个安装包的半成品 Release。
    if: always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -eu
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: '*'
          merge-multiple: true

      - name: Publish artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag='${{ steps.tag.outputs.tag }}'
          test -n "$tag"
          shopt -s nullglob
          files=(artifacts/*.dmg artifacts/*.exe artifacts/*.deb artifacts/*.AppImage artifacts/*.apk)
          ((${#files[@]} > 0)) || { echo '没有可附加的产物'; exit 1; }
          # 四个平台家族必须都有产物：Windows / Linux / macOS / Android。
          # 用 always() 进到这个 job 之后，这里才是真正的发布门禁。
          for pattern in '*.exe' '*.deb' '*.AppImage' '*.dmg' '*.apk'; do
            found=(artifacts/$pattern)
            ((${#found[@]} > 0)) || { echo "缺少产物: $pattern，不发布半成品 Release"; exit 1; }
          done
          # 本 job 不 checkout 仓库，必须显式指定 repo，否则 gh 无法判断目标仓库。
          repo="${{ github.repository }}"
          # Release 不存在时创建（tag 构建通常已由 tag 本身触发创建）。
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$repo" --title "$tag" --generate-notes
          gh release upload "$tag" --repo "$repo" "${files[@]}" --clobber
          echo "已上传到 Release $tag："
          printf '  %s\n' "${files[@]}"
