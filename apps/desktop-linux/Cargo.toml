[package]
name = "mctier-app-linux"
version = "3.10.0"
description = "MCTier Linux 独立应用壳（编译期不链接任何 Windows/macOS 专属 crate）"
authors = ["MCTier Team"]
edition = "2021"
publish = false

[[bin]]
name = "mctier-linux"
path = "src/main.rs"

[dependencies]
mctier-core = { path = "../../crates/mctier-core" }
mctier-platform = { path = "../../crates/mctier-platform" }
mctier-platform-linux = { path = "../../crates/mctier-platform-linux" }
mctier = { path = "../../src-tauri" }
