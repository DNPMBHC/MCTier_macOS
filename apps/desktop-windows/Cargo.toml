[package]
name = "mctier-app-windows"
version = "3.10.0"
description = "MCTier Windows 独立应用壳（编译期不链接任何 macOS/Linux 专属 crate）"
authors = ["MCTier Team"]
edition = "2021"
publish = false

[[bin]]
name = "mctier-windows"
path = "src/main.rs"

[dependencies]
mctier-core = { path = "../../crates/mctier-core" }
mctier-platform = { path = "../../crates/mctier-platform" }
mctier-platform-windows = { path = "../../crates/mctier-platform-windows" }
mctier = { path = "../../src-tauri" }
